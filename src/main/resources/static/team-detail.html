<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>KBTI | 팀 상세</title>
  <style>
    :root {
      --primary: #00529b;
      --secondary: #e61e2b;
      --bg: #f8f9fa;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 650px;
    }

    .home-btn {
      width: 100%;
      padding: 14px;
      background: #ddd;
      color: #333;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .home-btn:hover { background: #ccc; }

    .title-area {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      color: var(--primary);
      font-size: 28px;
    }

    .sub-title {
      margin: 10px 0 0;
      color: #666;
      font-size: 15px;
    }

    .kbti-area {
      margin: 25px 0 25px;
      padding: 18px 16px;
      border-radius: 18px;
      border: 2px solid var(--primary);
      background: #eef6ff;
      text-align: center;
    }

    .kbti-label {
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
    }

    .kbti-code {
      font-size: 40px;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: 4px;
    }

    .kbti-desc {
      margin-top: 12px;
      font-size: 14px;
      color: #333;
      font-weight: 800;
      line-height: 1.5;
    }

    .kbti-details {
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .kbti-details li {
      border: 2px solid #e9eef7;
      background: #fff;
      border-radius: 14px;
      padding: 12px 12px;
    }

    .d-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .d-key {
      font-weight: 900;
      color: var(--primary);
      font-size: 13px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .d-title {
      font-weight: 900;
      color: #333;
      font-size: 14px;
      flex: 1;
      text-align: right;
      white-space: nowrap;
    }

    .d-desc {
      color: #555;
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
    }

    .section-title {
      font-weight: 900;
      color: #333;
      font-size: 16px;
      margin: 18px 0 12px;
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .player-card {
      border: 2px solid #eee;
      border-radius: 16px;
      padding: 16px;
    }

    .player-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .player-rank {
      font-weight: 900;
      color: var(--primary);
      font-size: 14px;
    }

    .player-name {
      font-weight: 900;
      color: #333;
      font-size: 16px;
      flex: 1;
    }

    .player-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 14px;
      font-size: 13px;
      color: #444;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .meta-key {
      color: #777;
      font-weight: 700;
      white-space: nowrap;
    }

    .meta-val {
      font-weight: 800;
      color: #333;
      text-align: right;
      white-space: nowrap;
    }

    .stat-box {
      border: 2px solid #eee;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .stat-title {
      font-weight: bold;
      color: var(--secondary);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 15px;
      color: #444;
    }

    .empty {
      display: none;
      padding: 14px;
      border: 2px dashed #ddd;
      border-radius: 16px;
      text-align: center;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">

  <button class="home-btn" onclick="location.href='/'">홈으로</button>

  <div class="title-area">
    <h1 id="team-name">팀 이름</h1>
    <p class="sub-title">팀 전술 성향 상세 분석</p>
  </div>

  <div class="kbti-area">
    <div class="kbti-label">이 팀의 KBTI</div>
    <div class="kbti-code" id="team-kbti">----</div>

    <div class="kbti-desc" id="team-kbti-desc"></div>
    <ul class="kbti-details" id="team-kbti-details"></ul>
  </div>

  <div class="section-title">대표 선수 TOP 3 (평가점수 Raw 기준)</div>
  <div id="playerList" class="player-list"></div>
  <div id="playerEmpty" class="empty">대표 선수 데이터를 불러올 수 없습니다.</div>

  <div class="section-title">팀 전술 지표</div>

  <div class="stat-box">
    <div class="stat-title">전개 속도 (Tempo)</div>
    <div class="stat-value" id="tempo"></div>
  </div>

  <div class="stat-box">
    <div class="stat-title">패스 직선성 (Directness)</div>
    <div class="stat-value" id="directness"></div>
  </div>

  <div class="stat-box">
    <div class="stat-title">압박 강도 (Pressing)</div>
    <div class="stat-value" id="pressing"></div>
  </div>

  <div class="stat-box">
    <div class="stat-title">측면 활용도 (Side Usage)</div>
    <div class="stat-value" id="sideUsage"></div>
  </div>

  <div class="stat-box">
    <div class="stat-title">투지 (Fight)</div>
    <div class="stat-value" id="fight"></div>
  </div>

</div>

<script>
  function getTeamId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('teamId');
  }

  function safeNumber(v, digits = 2) {
    const n = Number(v);
    if (!Number.isFinite(n)) return '—';
    return n.toFixed(digits);
  }

  function safeInt(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return '—';
    return String(n);
  }

  function renderKbtiDetails(details) {
    const ul = document.getElementById('team-kbti-details');
    ul.innerHTML = '';
    (details || []).forEach(d => {
      const li = document.createElement('li');
      li.innerHTML = `
        <div class="d-head">
          <div class="d-key">${d.key ?? ''}</div>
          <div class="d-title">${d.title ?? ''}</div>
        </div>
        <div class="d-desc">${d.description ?? ''}</div>
      `;
      ul.appendChild(li);
    });
  }

  function renderTopPlayers(players) {
    const list = document.getElementById('playerList');
    const empty = document.getElementById('playerEmpty');

    list.innerHTML = '';

    if (!players || players.length === 0) {
      empty.style.display = 'block';
      return;
    }

    empty.style.display = 'none';

    players.slice(0, 3).forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'player-card';

      card.innerHTML = `
        <div class="player-top">
          <div class="player-rank">#${idx + 1}</div>
          <div class="player-name">${p.playerName ?? '—'}</div>
        </div>

        <div class="player-meta">
          <div class="meta-item">
            <span class="meta-key">포지션</span>
            <span class="meta-val">${p.position ?? '—'}</span>
          </div>
          <div class="meta-item">
            <span class="meta-key">역할군</span>
            <span class="meta-val">${p.roleGroup ?? '—'}</span>
          </div>
          <div class="meta-item">
            <span class="meta-key">경기수</span>
            <span class="meta-val">${safeInt(p.games)}</span>
          </div>
          <div class="meta-item">
            <span class="meta-key">AI평점</span>
            <span class="meta-val">${safeNumber(p.aiRating, 2)}</span>
          </div>
          <div class="meta-item" style="grid-column: 1 / -1;">
            <span class="meta-key">평가점수(Raw)</span>
            <span class="meta-val">${safeNumber(p.rawScore, 2)}</span>
          </div>
        </div>
      `;

      list.appendChild(card);
    });
  }

  async function loadTopPlayers(teamName) {
    try {
      const url = `/api/players/rank?team=${encodeURIComponent(teamName)}&top=3&minGames=15`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const players = await res.json();
      renderTopPlayers(players);
    } catch (e) {
      console.error(e);
      renderTopPlayers([]);
    }
  }

  async function loadTeamDetail() {
    const teamId = getTeamId();
    if (!teamId) {
      alert('잘못된 접근입니다.');
      location.href = '/';
      return;
    }

    try {
      const res = await fetch(`/api/teams/${teamId}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const t = await res.json();

      document.getElementById('team-name').innerText = t.teamName ?? '';
      document.getElementById('team-kbti').innerText = t.teamKbti ?? '—';

      document.getElementById('team-kbti-desc').innerText = t.teamKbtiDesc ?? '';
      renderKbtiDetails(t.teamKbtiDetails);

      document.getElementById('tempo').innerText = safeNumber(t.tempo, 2);
      document.getElementById('directness').innerText = safeNumber(t.directness, 2);
      document.getElementById('pressing').innerText = safeNumber(t.pressing, 2);
      document.getElementById('sideUsage').innerText = safeNumber(t.sideUsage, 2);
      document.getElementById('fight').innerText = safeNumber(t.fight, 2);

      if (t.teamName) {
        await loadTopPlayers(t.teamName);
      } else {
        renderTopPlayers([]);
      }

    } catch (e) {
      alert('팀 정보를 불러오지 못했습니다.');
      console.error(e);
    }
  }

  window.onload = loadTeamDetail;
</script>

</body>
</html>
