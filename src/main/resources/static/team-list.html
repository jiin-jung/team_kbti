<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>K-League 팀 조회</title>
    <style>
        :root {
            --primary: #00529b;
            --secondary: #e61e2b;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 28px;
            margin-bottom: 10px;
        }

        .sub-title {
            text-align: center;
            color: #666;
            margin-bottom: 22px;
            font-size: 15px;
        }

        .home-btn {
            width: 100%;
            padding: 14px;
            background: #ddd;
            color: #333;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 18px;
        }

        .home-btn:hover {
            background: #ccc;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .search-input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 14px;
            border: 2px solid #eee;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
            background: #eef6ff;
        }

        .search-btn {
            padding: 14px 16px;
            border-radius: 14px;
            border: none;
            background: #ddd;
            font-weight: 700;
            cursor: pointer;
        }

        .search-btn:hover {
            background: #ccc;
        }

        .team-card {
            border: 2px solid #eee;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .team-card:hover {
            border-color: var(--primary);
            background: #eef6ff;
        }

        .team-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .team-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--secondary);
            margin: 0;
        }

        .kbti-badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #ddd;
            background: #fff;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary);
            font-size: 12px;
            white-space: nowrap;
        }

        .stats {
            font-size: 14px;
            color: #444;
            line-height: 1.6;
        }

        .no-result {
            padding: 18px;
            text-align: center;
            color: #666;
            border: 2px dashed #ddd;
            border-radius: 16px;
            margin-top: 16px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">

    <button class="home-btn" onclick="location.href='/'">홈으로</button>

    <h1>K-League Teams</h1>
    <p class="sub-title">KBTI 분석 기준 팀 전술 리스트</p>

    <!-- 검색 -->
    <div class="search-bar">
        <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="팀 이름으로 검색 (예: 울산, 전북, 포항)"
        />
        <button class="search-btn" id="clearBtn" type="button">초기화</button>
    </div>

    <div id="team-list"></div>
    <div id="noResult" class="no-result">검색 결과가 없습니다.</div>
</div>

<script>
    let allTeams = [];

    function normalize(str) {
        return (str ?? '').toString().trim().toLowerCase();
    }

    function renderCards(teams) {
        const list = document.getElementById('team-list');
        const noResult = document.getElementById('noResult');

        list.innerHTML = '';

        if (!teams || teams.length === 0) {
            noResult.style.display = 'block';
            return;
        }

        noResult.style.display = 'none';

        teams.forEach(t => {
            const card = document.createElement('div');
            card.className = 'team-card';

            const kbti = t.teamKbti ? t.teamKbti : '—';

            card.innerHTML = `
                <div class="team-top">
                    <p class="team-name">${t.teamName}</p>
                    <span class="kbti-badge">${kbti}</span>
                </div>
                <div class="stats">
                    전개 속도: ${t.tempo}<br/>
                    패스 직선성: ${t.directness}<br/>
                    압박 강도: ${t.pressing}<br/>
                    측면 활용도: ${t.sideUsage}<br/>
                    투지: ${t.fight}
                </div>
            `;

            card.onclick = () => {
                location.href = `/team-detail.html?teamId=${t.teamId}`;
            };

            list.appendChild(card);
        });
    }

    function applySearch() {
        const q = normalize(document.getElementById('searchInput').value);
        if (!q) {
            renderCards(allTeams);
            return;
        }
        const filtered = allTeams.filter(t => normalize(t.teamName).includes(q));
        renderCards(filtered);
    }

    async function loadTeams() {
        try {
            const res = await fetch('/api/teams');
            allTeams = await res.json();
            renderCards(allTeams);
        } catch (e) {
            alert('팀 데이터를 불러오지 못했습니다.');
            console.error(e);
        }
    }

    window.onload = () => {
        loadTeams();

        const input = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');

        input.addEventListener('input', applySearch);

        clearBtn.addEventListener('click', () => {
            input.value = '';
            renderCards(allTeams);
        });
    };
</script>

</body>
</html>
